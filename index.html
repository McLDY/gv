<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极验验证码测试</title>
    <link href="css/style.css" rel="stylesheet" type="text/css">
</head>

<body>
    <div>
        <label for="gt">1. gt: </label>
        <input class="inp" id="gt" type="text" readonly="readonly">
    </div>
    <br>

    <div>
        <label for="challenge">2. challenge: </label>
        <input class="inp" id="challenge" type="text" readonly="readonly">
    </div>
    <br>

    <div>
        <label>3. 验证：</label>
        <div id="captcha">
            <div id="text">
                正在加载验证码...
            </div>
            <div id="wait" class="show">
                <div class="loading">
                    <div class="loading-dot"></div>
                    <div class="loading-dot"></div>
                    <div class="loading-dot"></div>
                    <div class="loading-dot"></div>
                </div>
            </div>
        </div>
    </div>
    <br>

    <div>
        <label for="result">4. 验证结果: </label>
        <input class="inp" id="result" type="text" readonly="readonly" placeholder="validate|seccode">
    </div>
    <br>

    <script src="js/jquery.js"></script>
    <script src="js/gt.js"></script>

    <script>
        // 从URL获取参数
        function getUrlParams() {
            var params = {};
            var queryString = window.location.search.substring(1);
            var pairs = queryString.split('&');
            
            for (var i = 0; i < pairs.length; i++) {
                var pair = pairs[i].split('=');
                if (pair.length === 2) {
                    params[decodeURIComponent(pair[0])] = decodeURIComponent(pair[1]);
                }
            }
            return params;
        }

        // 自动初始化验证码
        function initCaptcha(gt, challenge) {
            $('#text').hide();
            $('#wait').show();
            
            if (!gt || !challenge) {
                $('#wait').hide();
                $('#text').show().text('URL中缺少gt或challenge参数');
                return;
            }
            
            // 调用 initGeetest 进行初始化
            initGeetest({
                gt: gt,
                challenge: challenge,
                offline: false,
                new_captcha: true,
                product: "popup",
                width: "300px",
                https: true
            }, function(captchaObj) {
                captchaObj.appendTo('#captcha');
                captchaObj.onReady(function() {
                    $("#wait").hide();
                });
                
                // 监听验证成功事件
                captchaObj.onSuccess(function() {
                    var result = captchaObj.getValidate();
                    if (result) {
                        // 合并结果，用|分割
                        var combinedResult = result.geetest_validate + '|' + result.geetest_seccode;
                        $('#result').val(combinedResult);
                        
                        // 可选：自动复制到剪贴板
                        copyToClipboard(combinedResult);
                    }
                });
            });
        }

        // 复制到剪贴板函数（可选功能）
        function copyToClipboard(text) {
            var tempInput = document.createElement("input");
            tempInput.style = "position: absolute; left: -1000px; top: -1000px";
            tempInput.value = text;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);
        }

        // 页面加载时自动初始化
        $(document).ready(function() {
            var urlParams = getUrlParams();
            var gt = urlParams.gt || '';
            var challenge = urlParams.challenge || '';
            
            $('#gt').val(gt);
            $('#challenge').val(challenge);
            
            // 自动初始化验证码
            initCaptcha(gt, challenge);
        });
    </script>
</body>

</html>
