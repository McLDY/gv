<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极验验证码测试</title>
    <link href="css/style.css" rel="stylesheet" type="text/css">
</head>

<body>
    <div>
        <label for="gt">1. gt: </label>
        <input class="inp" id="gt" type="text" readonly="readonly">
    </div>
    <br>

    <div>
        <label for="challenge">2. challenge: </label>
        <input class="inp" id="challenge" type="text" readonly="readonly">
    </div>
    <br>

    <div id="btn-gen" class="btn">3. 生成验证码</div>
    <br><br>

    <div>
        <label>4. 验证：</label>
        <div id="captcha">
            <div id="text">
                请先生成验证码
            </div>
            <div id="wait" class="show">
                <div class="loading">
                    <div class="loading-dot"></div>
                    <div class="loading-dot"></div>
                    <div class="loading-dot"></div>
                    <div class="loading-dot"></div>
                </div>
            </div>
        </div>
    </div>
    <br>

    <div id="btn-result" class="btn">5. 获取结果</div>
    <br><br>

    <div>
        <label for="result">验证结果: </label>
        <input class="inp" id="result" type="text" readonly="readonly" placeholder="validate|seccode">
    </div>
    <br>

    <script src="js/jquery.js"></script>
    <script src="js/gt.js"></script>

    <script>
        // 从URL获取参数
        function getUrlParams() {
            var params = {};
            var queryString = window.location.search.substring(1);
            var pairs = queryString.split('&');
            
            for (var i = 0; i < pairs.length; i++) {
                var pair = pairs[i].split('=');
                if (pair.length === 2) {
                    params[decodeURIComponent(pair[0])] = decodeURIComponent(pair[1]);
                }
            }
            return params;
        }

        // 页面加载时从URL获取参数
        $(document).ready(function() {
            var urlParams = getUrlParams();
            var gt = urlParams.gt || '';
            var challenge = urlParams.challenge || '';
            
            $('#gt').val(gt);
            $('#challenge').val(challenge);
            
            // 如果参数存在，自动生成验证码
            if (gt && challenge) {
                $('#btn-gen').click();
            }
        });

        var handler = function (captchaObj) {
            captchaObj.appendTo('#captcha');
            captchaObj.onReady(function () {
                $("#wait").hide();
            });
            $('#btn-result').click(function () {
                var result = captchaObj.getValidate();
                if (!result) {
                    return alert('请先完成验证');
                }
                // 合并结果，用|分割
                var combinedResult = result.geetest_validate + '|' + result.geetest_seccode;
                $('#result').val(combinedResult);
            });
            // 更多前端接口说明请参见：http://docs.geetest.com/install/client/web-front/
        };

        $('#btn-gen').click(function () {
            $('#text').hide();
            $('#wait').show();
            var gt = $('#gt').val();
            var challenge = $('#challenge').val();
            
            if (!gt || !challenge) {
                alert('请确保URL中包含gt和challenge参数');
                $('#wait').hide();
                $('#text').show();
                return;
            }
            
            // 调用 initGeetest 进行初始化
            // 参数1：配置参数
            // 参数2：回调，回调的第一个参数验证码对象，之后可以使用它调用相应的接口
            initGeetest({
                // 以下 4 个配置参数为必须，不能缺少
                gt: gt,
                challenge: challenge,
                offline: false, // 表示用户后台检测极验服务器是否宕机
                new_captcha: true, // 用于宕机时表示是新验证码的宕机

                product: "popup", // 产品形式，包括：float，popup
                width: "300px",
                https: true

                // 更多前端配置参数说明请参见：http://docs.geetest.com/install/client/web-front/
            }, handler);
        });
    </script>
</body>

</html>
